function chart(runs,color){const p=runs.filter(r=>r.resp_ms!=null);if(!p.length)return"<p class='note'>Noch keine Messwerte.</p>";
const W=900,H=260,L=52,R=24,T=20,B=34;const ymax=Math.max(...p.map(r=>r.resp_ms))*1.25||1;
let step=Math.pow(10,String(Math.floor(ymax)).length)/10;for(const k of[1,2,2.5,5,10]){if(ymax/(step*k)<=4){step*=k;break}}
const ticks=[];for(let t=0;t<=ymax*1.0001;t+=step)ticks.push(t);const top=Math.max(ticks[ticks.length-1],ymax);
const x=i=>L+(W-L-R)*(i+.5)/p.length,y=v=>H-B-(H-B-T)*v/top;
let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Antwortzeit im Verlauf">`;
for(const t of ticks)o+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="#e6e9e7"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" font-size="13" fill="#667">${Math.round(t)}</text>`;
if(p.length>1)o+=`<polyline points="${p.map((r,i)=>x(i)+','+y(r.resp_ms)).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5"/>`;
p.forEach((r,i)=>{o+=`<circle cx="${x(i)}" cy="${y(r.resp_ms)}" r="5" fill="${color}"><title>${D(r.date)}: ${r.resp_ms} ms</title></circle><text x="${x(i)}" y="${y(r.resp_ms)-11}" text-anchor="middle" font-size="13" fill="#445">${r.resp_ms}</text><text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="13" fill="#667">${D(r.date)}</text>`});
return o+'</svg>'}
function render(runs){runs.sort((a,b)=>a.date.localeCompare(b.date));const l=runs[runs.length-1];const hb=runs.some(r=>r.backup);
const tile=(k,v,x='')=>`<div class="tile"><p class="k">${k}</p><p class="v">${v}${x}</p></div>`;
$('#sub').innerHTML=NAME+' · Stand: <b>'+D(l.date)+'</b>';
$('#tiles').innerHTML=tile('Status',`<span class="${ST(l.status)}">${E(l.status)}</span>`)+tile('Unterseiten erreichbar',l.pages_ok,` <small>von ${l.pages_total}</small>`)+tile('Defekte Links',l.links_broken)+tile('Kontaktformular',E(l.form))+tile('Antwortzeit',l.resp_ms,' <small>ms</small>');
$('#note').textContent=l.client_note;$('#chart').innerHTML=chart(runs,LINE);
$('#head').innerHTML='<tr><th>Datum</th><th>Status</th><th>Unterseiten OK</th><th>Defekte Links</th><th>Kontaktformular</th><th>Antwortzeit (ms)</th>'+(hb?'<th>Backup</th>':'')+'<th>Zusammenfassung</th></tr>';
$('#rows').innerHTML=[...runs].reverse().map(r=>`<tr><td>${D(r.date)}</td><td class="${ST(r.status)}">${E(r.status)}</td><td class="n">${r.pages_ok}</td><td class="n">${r.links_broken}</td><td>${E(r.form)}</td><td class="n">${r.resp_ms}</td>${hb?`<td>${E(r.backup||'—')}</td>`:''}<td class="t">${E(r.client_note)}</td></tr>`).join('');
$('#content').hidden=false;$('#msg').hidden=true}
fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(render).catch(()=>{$('#msg').textContent='Der aktuelle Bericht konnte nicht geladen werden. Bitte Internetverbindung prüfen und die Seite neu laden.'});
</script></body></html>
